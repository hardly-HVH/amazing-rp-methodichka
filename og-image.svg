<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="0.55" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#121d33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c878"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6c878"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- декоративная сетка -->
  <g opacity="0.05">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200" stroke="#c9a24b" stroke-width="1"/>
    <path d="M100 0 V630 M300 0 V630 M500 0 V630 M700 0 V630 M900 0 V630 M1100 0 V630" stroke="#c9a24b" stroke-width="1"/>
  </g>

  <!-- сияние -->
  <circle cx="600" cy="315" r="360" fill="url(#gold)" opacity="0.07"/>

  <!-- герб-щит -->
  <g transform="translate(600, 250)">
    <path d="M0 -190 L 78 -140 L 78 -35 C 78 60 40 115 0 150 C -40 115 -78 60 -78 -35 L -78 -140 Z" fill="rgba(11,19,34,.92)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0 -170 L 66 -127 L 66 -35 C 66 45 36 92 0 122 C -36 92 -66 45 -66 -35 L -66 -127 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".55"/>
    <!-- звезда в щите -->
    <path d="M0 -110 L 8.5 -78 L 42 -77 L 15 -56 L 24 -24 L 0 -43 L -24 -24 L -15 -56 L -42 -77 L -8.5 -78 Z" fill="url(#gold)"/>
    <path d="M0 -20 L 12 -16 L 0 -12 L -12 -16 Z" fill="url(#gold)"/>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="26" letter-spacing="6" fill="#e6c878">LAW</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#c9a24b">OFFICE</text>
  </g>

  <!-- нижняя золотая линия -->
  <rect x="420" y="490" width="360" height="3" rx="1.5" fill="url(#goldline)"/>

  <!-- заголовки -->
  <text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="40" fill="#f4f6fb" letter-spacing="2">МАГАЗИН ЦИФРОВЫХ УСЛУГ</text>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#93a5c0" letter-spacing="1">AMAZING ONLINE · Ali_Arkham</text>
</svg>

